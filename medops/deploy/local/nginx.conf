# 本地试跑 / 内网纯 HTTP 站点配置
# 与生产版 ../nginx/conf.d/site.conf 结构一致，去掉了 443、证书与 HSTS（无 HTTPS 时 HSTS 有害）

server {
    # 只监听 IPv4：Windows/Mac 的 Docker Desktop 默认关闭容器 IPv6，
    # 写 listen [::]:80 会让 nginx 直接启动失败（Address family not supported）。
    # 服务器确认支持 IPv6 时，可自行加回 listen [::]:80;
    listen 80;
    server_name _;                 # 任何域名/IP 都接

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /srv;
    charset utf-8;

    # ---- / 统一入口页 ----
    location = / {
        root /srv/landing;
        index index.html;
    }
    location = /index.html {
        root /srv/landing;
        etag on;
        add_header Cache-Control "no-cache";
    }

    # ---- /xunjian/ 巡检 H5 ----
    location /xunjian/ {
        index index.html;
    }

    # ---- /admin/ 巡检管理后台（SPA，任意路由回退 index.html）----
    location /admin/ {
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- /pandian/ 资产盘点（注入版）----
    location /pandian/ {
        index index.html;
    }
    location = /pandian/app.bundle.js {
        etag on;
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        etag on;
        add_header Cache-Control "no-cache";
    }

    # ---- /api/ 反代后端 ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }
}
