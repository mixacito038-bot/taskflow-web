# 本地试跑 / 内网纯 HTTP 部署（无域名、无证书、无 certbot）
# 用法：cd medops/deploy/local && docker compose up -d
# 访问：http://localhost:8080/   （内网服务器上换成 http://服务器IP:8080/）
#
# 与生产版 ../docker-compose.yml 的差别：
#   · 去掉 certbot 容器与证书卷（本地/内网无法做公网验证）
#   · nginx 只监听 80（映射到宿主 8080），不跳转 HTTPS
#   · JWT_SECRET 用固定占位值——**仅限本地试跑**；内网正式使用请改成随机长串

services:
  api:
    build: ../../server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-local-trial-only-change-me-before-real-use}
    volumes:
      - ../../data-docker:/data
    expose:
      - "3000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../landing:/srv/landing:ro
      - ../../h5:/srv/xunjian:ro
      - ../../admin/dist:/srv/admin:ro
      - ../../ams/dist:/srv/pandian:ro
