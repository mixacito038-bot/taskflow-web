# 站点配置（接口契约 §7）
# YOUR_DOMAIN 为域名占位符，由 scripts/first-run.sh 用 sed 自动替换；
# 手工替换：sed -i "s/YOUR_DOMAIN/你的域名/g" nginx/conf.d/site.conf

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt webroot 验证（certbot 续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS。注意：nginx 的 add_header 不会向自带 add_header 的 location 继承，
    # 故下方每个设置了缓存头的 location 都重复声明了一份
    add_header Strict-Transport-Security "max-age=15552000" always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    # text/html 默认参与压缩，无需列出
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /srv;
    charset utf-8;

    # ---- / 统一入口页（自包含单文件）----
    location = / {
        root /srv/landing;
        index index.html;
    }
    location = /index.html {
        root /srv/landing;
        etag on;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # ---- /xunjian/ 巡检 H5 ----
    location /xunjian/ {
        index index.html;
    }

    # ---- /admin/ 巡检管理后台（SPA，任意路由回退 index.html）----
    location /admin/ {
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    # 带内容哈希的构建产物：缓存一年
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # ---- /pandian/ 资产盘点（注入版）----
    location /pandian/ {
        index index.html;
    }
    # bundle 文件名无哈希：no-cache + ETag，靠 304 复用缓存
    location = /pandian/app.bundle.js {
        etag on;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # 所有 .html 一律 no-cache + ETag（/ 的 index.html 已由上方精确匹配接管）
    location ~* \.html$ {
        etag on;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # ---- /api/ 反代后端 ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # 契约 §7：附件/导入上限
        proxy_read_timeout 120s;    # 月报导出耗时较长
    }
}
