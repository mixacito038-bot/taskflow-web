# HTTP→HTTPS 跳转（可选叠加层）
#
# 切到 443 之后，有人在浏览器里直接敲域名（不写 https://），浏览器默认走
# http:// 也就是 80 端口，此时会显示「无法访问此网站」——用户会以为系统坏了。
# 这一层把宿主机 80 端口也接进来，nginx 收到后 301 跳到 https。
#
# 由 enable-https.sh 通过 .env 里的 COMPOSE_FILE 自动挂载，不用手工 -f 指定。
# 前提：宿主机 80 端口空闲 + 腾讯云安全组放行 80 + 域名已备案。
services:
  web:
    ports:
      - "80:80"
