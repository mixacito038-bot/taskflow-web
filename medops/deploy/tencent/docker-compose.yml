# 腾讯云单机部署编排（对外只开一个端口，默认 8912，纯 HTTP）
# 首次部署：在本目录执行  bash deploy.sh
# 日常运维：bash manage.sh 状态 / 日志 / 备份 / 升级 …
#
# 与 ../docker-compose.yml（80+443+certbot 版）的差别：
#   · 去掉 certbot：Let's Encrypt 的 HTTP-01 验证必须用 80 端口，只开 8912 时签不下来
#   · nginx 只监听容器内 80，由 ports 映射到宿主 ${WEB_PORT}
#   · 想上 HTTPS 时执行 bash enable-https.sh（用腾讯云免费证书，不需要开 80）
name: medops

services:
  api:
    build:
      context: ../../server
      args:
        # 国内服务器走 npmmirror，直连 npmjs.org 常年超时。
        # 想用官方源就在 .env 里设 NPM_REGISTRY=https://registry.npmjs.org
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?缺少 JWT_SECRET。请先执行 bash deploy.sh 生成配置}
      # 限流阈值按"全院共用一个出口 IP"来定，见 .env.example 说明
      RL_LOGIN: ${RL_LOGIN:-60}
      RL_GLOBAL: ${RL_GLOBAL:-1200}
    volumes:
      # 数据（SQLite 库 / 签名图 / 附件 / 每日自动备份）放在代码目录之外，
      # 以后重新上传源码包覆盖代码时数据不受影响
      - ${DATA_DIR:-/opt/medops-data}:/data
    # 刻意不映射宿主端口：后端只允许 nginx 从容器网络内访问，不对公网暴露
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # 防止日志把系统盘写满

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 容器内端口：HTTP 版是 80，enable-https.sh 会把 WEB_INNER_PORT 改成 443
      - "${WEB_PORT:-8912}:${WEB_INNER_PORT:-80}"
    volumes:
      # 挂哪份配置由 .env 的 NGINX_CONF 决定（nginx.conf / nginx-https.conf）
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ../landing:/srv/landing:ro        # 统一入口页
      - ../../h5:/srv/xunjian:ro          # 巡检 H5（单文件，替换后刷新即生效）
      - ../../admin/dist:/srv/admin:ro    # 管理后台构建产物
      - ../../ams/dist:/srv/pandian:ro    # 资产盘点注入版
      - ./certs:/etc/nginx/certs:ro       # HTTPS 证书（未启用 HTTPS 时是空目录，不影响）
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
