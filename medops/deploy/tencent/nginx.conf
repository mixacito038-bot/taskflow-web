# 腾讯云单端口站点配置（对外 http://服务器IP:8912/）
#
# 两个和"非标准端口"直接相关的坑，已经在下面处理：
#   1. absolute_redirect off —— nginx 容器内部监听的是 80，浏览器访问的是 8912。
#      默认情况下访问 /admin（少打一个斜杠）时 nginx 会 301 到 http://IP/admin/，
#      端口 8912 被丢掉，用户看到"打不开"。关掉绝对跳转后只发相对路径 /admin/，端口自然保留。
#   2. proxy_set_header Host $host —— 保留浏览器带来的 IP:8912，后端拼出来的链接才对。

# 登录接口限流：后端已有账号级冻结（连错 5 次）与设备级冷却，这里只是网络层兜底，
# 防止有人拿脚本狂刷把后端 CPU 打满。10m 约能存 16 万个 IP。
#
# ⚠ 阈值不能定太严：医院整栋楼共用一个出口 IP，交接班时几十号人同时登录，
#   在 nginx 看来全是同一个来源。早先设成 20r/m，实测交接班量级就会把正常用户挡在门外。
#   现在 120r/m（约 2 次/秒）+ 突发 30，够全院同时上线，
#   同时把暴力破解压到每小时几千次量级——而真正拦住撞库的是后端的账号冻结。
limit_req_zone $binary_remote_addr zone=login:10m rate=120r/m;

# Docker 内嵌 DNS。配合下面 proxy_pass 里的变量，把后端地址改成"每次请求时再解析"。
# 不这么做的话：nginx 启动那一刻若 api 容器还没注册进 DNS，nginx 会直接
# 「host not found in upstream」启动失败 —— 服务器重启后最容易出现这种竞态。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    # 只监听 IPv4。服务器确认支持 IPv6 时可自行加回 listen [::]:80;
    # （腾讯云部分机型默认不给容器 IPv6，写了会导致 nginx 启动失败）
    listen 80;
    server_name _;                 # 用 IP 访问、以后绑域名都不用改这里

    absolute_redirect off;         # 见文件顶部说明，非标准端口必须关
    server_tokens off;             # 不在响应头里暴露 nginx 版本号
    charset utf-8;
    root /srv;

    # 公网暴露的基本防护头
    # 注意：nginx 的 add_header 只在"当前层没有任何 add_header"时才从上层继承。
    # 所以下面各 location 一律用 expires 指令控制缓存，不再写 add_header Cache-Control，
    # 否则这三个安全头会在那些 location 里被静默丢掉（实测过）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- / 统一入口页 ----
    location = / {
        root /srv/landing;
        index index.html;
    }
    location = /index.html {
        root /srv/landing;
        etag on;
        expires -1;              # = Cache-Control: no-cache（见上方注释，不用 add_header）
    }
    # 二维码生成页也在 landing 目录里。不单独写这一条的话会落到 root /srv 找不到而 404
    location = /qrcode.html {
        root /srv/landing;
        etag on;
        expires -1;              # = Cache-Control: no-cache（见上方注释，不用 add_header）
    }

    # ---- /xunjian/ 巡检 H5（手机端）----
    location /xunjian/ {
        index index.html;
    }

    # ---- /admin/ 巡检管理后台（SPA，刷新任意路由都回退到 index.html）----
    location /admin/ {
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin/assets/ {
        # 文件名带内容哈希，可以放心长期缓存。这里必须把三个安全头重写一遍，
        # 因为本层用了 add_header，上层的就不再继承了。
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- /pandian/ 资产盘点（注入版）----
    location /pandian/ {
        index index.html;
    }
    location = /pandian/app.bundle.js {
        etag on;
        expires -1;              # = Cache-Control: no-cache（见上方注释，不用 add_header）
    }

    location ~* \.html$ {
        etag on;
        expires -1;              # = Cache-Control: no-cache（见上方注释，不用 add_header）
    }

    # ---- /api/auth/ 登录相关：加网络级限流 ----
    location /api/auth/ {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }

    # ---- /api/ 其余接口反代后端 ----
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;      # 签名图 / Excel 导入 / 资产附件
        proxy_read_timeout 120s;       # 月报导出数据量大时要等十几秒
    }
}
